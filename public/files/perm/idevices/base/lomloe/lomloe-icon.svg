<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <!-- Background circle -->
  <circle cx="125" cy="125" r="120" fill="#1565c0"/>
  <!-- Document body -->
  <rect x="60" y="50" width="130" height="160" rx="8" ry="8" fill="white" opacity="0.95"/>
  <!-- Document header bar -->
  <rect x="60" y="50" width="130" height="32" rx="8" ry="8" fill="#e3f2fd"/>
  <rect x="60" y="66" width="130" height="16" fill="#e3f2fd"/>
  <!-- Title lines -->
  <rect x="75" y="60" width="60" height="6" rx="3" fill="#1565c0"/>
  <!-- Checklist rows -->
  <!-- Row 1 - checked -->
  <rect x="75" y="100" width="12" height="12" rx="2" fill="#1565c0"/>
  <polyline points="77,106 80,110 86,103" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="95" y="102" width="75" height="5" rx="2" fill="#90caf9"/>
  <rect x="95" y="110" width="55" height="3" rx="1.5" fill="#bbdefb"/>
  <!-- Row 2 - checked -->
  <rect x="75" y="124" width="12" height="12" rx="2" fill="#1565c0"/>
  <polyline points="77,130 80,134 86,127" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="95" y="126" width="85" height="5" rx="2" fill="#90caf9"/>
  <rect x="95" y="134" width="65" height="3" rx="1.5" fill="#bbdefb"/>
  <!-- Row 3 - unchecked -->
  <rect x="75" y="148" width="12" height="12" rx="2" fill="none" stroke="#90caf9" stroke-width="2"/>
  <rect x="95" y="150" width="70" height="5" rx="2" fill="#e3f2fd"/>
  <rect x="95" y="158" width="50" height="3" rx="1.5" fill="#e3f2fd"/>
  <!-- Row 4 - checked -->
  <rect x="75" y="172" width="12" height="12" rx="2" fill="#1565c0"/>
  <polyline points="77,178 80,182 86,175" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="95" y="174" width="80" height="5" rx="2" fill="#90caf9"/>
  <!-- Small "LOMLOE" label at bottom -->
  <text x="125" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">LOMLOE</text>
</svg>
